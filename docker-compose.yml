# Local PostgreSQL for development.
#   docker compose up -d
# Matches DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/jobtrail
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobtrail
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jobtrail-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobtrail"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobtrail-pgdata:
